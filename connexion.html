<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/connexion.css">
</head>
<body>
  <div class="connexion-container">

    <!-- En-tête -->
    <div class="head">

        <div class="logo">
            PharmaCare
        </div>

        <p>Bienvenue sur PharmaCare</p>

        <h2>Connexion</h2>

    </div>


    <!-- Formulaire -->
    <div class="fin">

        <form action="#" method="post">

            <!-- Email -->
            <div class="champ">

                <label for="email">
                    Email:
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="exemple@email.com"
                    required
                >

            </div>


            <!-- Mot de passe -->
            <div class="champ">

                <label for="password">
                    Mot de passe:
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Votre mot de passe"
                    required
                >

            </div>


            <!-- Mot de passe oublié -->
            <div class="oublie">

                <a href="#">
                    Mot de passe oublié ?
                </a>

            </div>


            <!-- Bouton -->
            <button type="submit">
                SE CONNECTER
            </button>


            <!-- Inscription -->
            <div class="inscription">

                <p>
                    Vous n'avez pas de compte ?
                </p>

                <a href="inscription.html">
                    Créer un compte
                </a>

            </div>

        </form>

    </div>

</div>
</body>
</html>
